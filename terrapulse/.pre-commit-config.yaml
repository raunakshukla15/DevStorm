repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        files: ^backend/
  - repo: local
    hooks:
      - id: frontend-oxlint
        name: frontend oxlint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/src/
