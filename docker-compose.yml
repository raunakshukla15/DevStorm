services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      TERRAPULSE_DB_PATH: /app/data/terrapulse.db
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      MAX_CONCURRENT_JOBS: "2"
    volumes:
      - terrapulse_data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api/v1
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  terrapulse_data:
